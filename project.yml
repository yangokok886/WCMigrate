name: XChatTransfer
options:
  bundleIdPrefix: local.xchat
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: Resources/AppGroup.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: local.xchat.transfer
    MARKETING_VERSION: 1.0.2
    CURRENT_PROJECT_VERSION: 27
    TARGETED_DEVICE_FAMILY: '1,2'
    CLANG_ENABLE_MODULES: YES
    HEADER_SEARCH_PATHS: '$(SRCROOT)/Vendor/WQFiles $(SRCROOT)/ContainerAccess $(SRCROOT)/CSupport/include'
    SWIFT_OBJC_BRIDGING_HEADER: ContainerAccess/BridgingHeader.h
targets:
  XChatTransfer:
    type: application
    platform: iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - App
      - Core
      - CSupport
      - ContainerAccess
      - Vendor/WQFiles
      - path: Resources/ThirdPartyNotices.txt
        buildPhase: resources
      - path: Resources/GPL.txt
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: WCMigrate
        CFBundleName: WCMigrate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        LSSupportsOpeningDocumentsInPlace: YES
        UIFileSharingEnabled: YES
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: Security.framework

  XChatTransferUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.xchat.transfer.uitests
        SWIFT_OBJC_BRIDGING_HEADER: ''
        CODE_SIGN_ENTITLEMENTS: ''
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: XChatTransfer
    dependencies:
      - target: XChatTransfer
schemes:
  XChatTransfer:
    build:
      targets:
        XChatTransfer: all
    test:
      targets:
        - XChatTransferUITests
